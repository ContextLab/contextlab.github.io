[mypy]
# Analyse for the interpreter CI uses, not whichever one a contributor happens
# to have. Without this, mypy targets the running interpreter and a local pass
# can disagree with the workflow.
python_version = 3.11

# openpyxl, bs4, PIL, selenium and friends ship no stubs we depend on. Their
# absence is not a finding about this codebase.
ignore_missing_imports = True

# Checked by default, so a bare `mypy` matches what build-content.yml runs.
files = scripts, tests

exclude = (^|/)(\.mypy_cache|\.ruff_cache)/
