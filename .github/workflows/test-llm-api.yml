name: Test Dartmouth Chat API

# Onboarding rewrites member bios with an LLM. That call goes to Dartmouth's
# own chat.dartmouth.edu rather than a paid third-party API, so this workflow
# is what proves the key still works, the model we name still exists, and the
# response still has the shape the code unpacks.
#
# Runs on demand, weekly, and whenever the client or its callers change.
# It never prints the key -- only model identifiers and generated text.

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/dartmouth_chat.py'
      - 'scripts/onboard_member.py'
      - '.github/workflows/test-llm-api.yml'
  workflow_dispatch:
  schedule:
    # Mondays, 09:30 UTC. Catches a revoked key or a retired model before an
    # onboarding run does.
    - cron: '30 9 * * 1'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: List the models this account can reach
        env:
          # Via env, never inline in the script: an inline ${{ }} would be
          # substituted into the source before it runs.
          DARTMOUTH_CHAT_API_KEY: ${{ secrets.DARTMOUTH_CHAT_API_KEY }}
        run: |
          cd scripts && python dartmouth_chat.py --models

      - name: Run the client and bio tests against the live service
        env:
          DARTMOUTH_CHAT_API_KEY: ${{ secrets.DARTMOUTH_CHAT_API_KEY }}
        run: |
          pytest tests/test_dartmouth_chat.py -v -rs --junitxml=llm-results.xml

      - name: Fail if the live tests skipped instead of running
        if: always()
        run: |
          # Without the key every network test skips and the job still passes,
          # which would leave the API silently unverified.
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          suite = ET.parse("llm-results.xml").getroot().find("testsuite")
          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          print(f"{total} collected, {skipped} skipped")
          if total == 0:
              sys.exit("::error::No tests ran.")
          if skipped:
              sys.exit(f"::error::{skipped} skipped -- the key did not reach pytest.")
          print("The live service was really exercised.")
          PY
