name: Build CV

on:
  push:
    branches:
      - main
    paths:
      - 'documents/JRM_CV.tex'
      - 'scripts/build_cv.py'
      - 'scripts/extract_cv.py'
      - 'css/cv.css'
      - '.github/workflows/build-cv.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'documents/JRM_CV.tex'
      - 'scripts/build_cv.py'
      - 'scripts/extract_cv.py'
      - 'css/cv.css'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:  # Allow manual triggering

# Both build workflows commit and push to main, and a push touching
# documents/JRM_CV.tex starts both at once. Serialize them so the second
# one cannot be rejected as non-fast-forward.
concurrency:
  group: main-autocommit
  cancel-in-progress: false

jobs:
  build-cv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true
          # Full history: build_cv.py stamps the PDF (and its "Last updated"
          # date) with JRM_CV.tex's last commit time, which a shallow clone
          # does not have.
          fetch-depth: 0

      - name: Install TeX Live
        run: |
          sudo apt-get update
          # texlive-lang-greek provides greek-fontenc's puenc-greek.def, which
          # hyperref's puenc.def \inputs unconditionally. Without it xelatex
          # emergency-stops with "File `puenc-greek.def' not found."
          sudo apt-get install -y texlive-xetex texlive-fonts-extra texlive-latex-extra texlive-lang-greek

      - name: Install fonts
        run: |
          mkdir -p ~/.fonts
          # Every font the CV needs ships in data/, so the runner renders the
          # same glyphs a local build does.
          cp data/*.ttf ~/.fonts/
          fc-cache -fv
          fc-list | grep -i "Dartmouth Ruzicka" || (echo "Ruzicka not registered" && exit 1)
          fc-list | grep -i "JetBrains Mono" || (echo "JetBrains Mono not registered" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-build.txt'

      - name: Install Python dependencies
        run: pip install -r requirements-build.txt

      - name: Build CV (PDF and HTML)
        working-directory: scripts
        run: python build_cv.py

      - name: Run CV tests
        run: python -m pytest tests/test_build_cv.py -v

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain documents/JRM_CV.pdf documents/JRM_CV.html) ]]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: github.event_name == 'push' && steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add documents/JRM_CV.pdf documents/JRM_CV.html
          git diff --staged --quiet || git commit -m "Auto-build: Update CV PDF and HTML from LaTeX source"
          # A conflict here means a newer commit on main already changed the
          # CV outputs. Every such commit also changes JRM_CV.tex or the build
          # scripts, so it has its own run of this workflow queued behind this
          # one, and that run builds from newer source. This build is stale:
          # drop it instead of failing.
          if ! git pull --rebase; then
            git rebase --abort
            echo "::notice::main moved on with newer CV changes; its own build run supersedes this one"
            exit 0
          fi
          git push
